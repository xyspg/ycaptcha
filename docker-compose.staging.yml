# Staging deployment template — point Dokploy services at the per-app Dockerfiles
# instead of using this file directly. Kept here as a single-source reference for
# the env contract.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ycaptcha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ycaptcha
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycaptcha"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ycaptcha:${POSTGRES_PASSWORD}@postgres:5432/ycaptcha
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SENTRY_DSN: ${API_SENTRY_DSN}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_WIDGET_URL: ${PUBLIC_WIDGET_URL}
    environment:
      DATABASE_URL: postgres://ycaptcha:${POSTGRES_PASSWORD}@postgres:5432/ycaptcha
      WIDGET_URL: ${PUBLIC_WIDGET_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_GITHUB_URL: ${PUBLIC_GITHUB_URL}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${PUBLIC_R2_URL}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
